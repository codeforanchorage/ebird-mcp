[project]
name = "ebird-mcp"
version = "1.0.0"
description = "eBird MCP server for AWS Lambda — provides eBird API tools to MCP clients (Claude, etc.)"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "tenacity>=8.0.0",
    "python-json-logger>=2.0.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    # A declared outputSchema is binding — the MCP spec requires structured
    # results to conform and lets clients validate. tests/test_structured_
    # output.py holds the server to that by validating real tool output
    # against the declared schemas. Test-only; never imported by the Lambda.
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "server*", "plugins*", "custom_plugins*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project]
name = "ebird-mcp"
version = "1.0.0"
description = "eBird MCP server for AWS Lambda — provides eBird API tools to MCP clients (Claude, etc.)"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Provides the `core` and `server` packages. Keep in step with
    # requirements.txt.
    "opencontext-core @ git+https://github.com/codeforanchorage/opencontext-core@v1.4.1",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "tenacity>=8.0.0",
    "python-json-logger>=3.1.0",
]

[project.optional-dependencies]
dev = [
    # scripts/local_server.py only; not in the Lambda package.
    "aiohttp>=3.8.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    # A declared outputSchema is binding — the MCP spec requires structured
    # results to conform and lets clients validate. tests/test_structured_
    # output.py holds the server to that by validating real tool output
    # against the declared schemas. Test-only; never imported by the Lambda.
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plugins*", "custom_plugins*"]

# Pinned to the rule set this code was written against (ruff's defaults
# through 0.15). The dev requirement is an open `ruff>=0.1.0`, and newer
# releases enable far more by default: 0.17 reports 271 findings here,
# almost all typing-style rewrites (List -> list, Optional[X] -> X | None).
# Without this, "lint must be clean" depends on which ruff pip resolved
# that day. Widen it deliberately, in its own change.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

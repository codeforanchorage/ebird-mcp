name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Lambda runtime (terraform/aws/main.tf); test what ships.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: uv.lock

      # From uv.lock, not requirements-dev.txt: scripts/deploy.sh installs
      # the locked versions into the Lambda package, so these are the
      # versions that ship. --locked fails if the lock is stale.
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --locked --extra dev

      - name: Lint
        run: uv run --no-sync python -m ruff check .

      # pytest rather than `unittest discover`: it runs the same TestCase
      # classes PLUS the function-style tests in tests/test_core_dependency.py
      # (which unittest silently skips), and applies the tests/conftest.py
      # global-state fixture to every test. No network, no config.yaml and
      # no eBird key needed: upstream calls are stubbed.
      - name: Test
        run: uv run --no-sync python -m pytest tests -q
